name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    # ubuntu-22.04: glibc/toolchain versions buildozer 1.5 expects
    runs-on: ubuntu-22.04

    steps:

      # ── 1. source ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Python 3.10 (matches buildozer.spec) ───────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 4. system deps ────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            cmake ninja-build \
            autoconf libtool pkg-config \
            libffi-dev libssl-dev \
            zlib1g-dev libltdl-dev \
            libbz2-dev libreadline-dev \
            libsqlite3-dev libncursesw5-dev \
            libgdbm-dev liblzma-dev uuid-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            ffmpeg libavcodec-dev \
            libavformat-dev libswscale-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      # ── 5. pip: Cython PINNED to 0.29.36 (pyjnius hard requirement) ───────
      - name: Install Python build tools
        run: |
          pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.36"
          pip install "buildozer==1.5.0"

      # ── 6. cache NDK/SDK (~4 GB) — keyed on spec so spec change busts it ──
      - name: Cache buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-bz-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-bz-

      # ── 7. pre-accept Android SDK licenses ────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

      # ── 8. build ──────────────────────────────────────────────────────────
      - name: Build debug APK
        run: buildozer -v android debug

      # ── 9. upload artifact (7-day retention) ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name:           football-quiz-${{ github.sha }}
          path:           bin/*.apk
          retention-days: 7
